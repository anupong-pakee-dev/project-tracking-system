# Local services for development:  npm run db:up   (or: docker compose up -d)
#   dev database:  postgresql://tracker:tracker@localhost:5432/tracker
#   test database: postgresql://tracker:tracker@localhost:5432/tracker_test  (wiped by `npm test`)
#   email inbox:   http://localhost:8025  (Mailpit, SMTP on localhost:1025)
name: project-tracker

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: tracker
      POSTGRES_DB: tracker
      # Keep the server on UTC: Prisma's pg adapter sends timestamps as UTC without an offset,
      # so any other session TimeZone shifts every stored timestamp.
    ports:
      - "127.0.0.1:5432:5432" # reachable from this machine only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker -d tracker"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email the API sends (verify email, reset password).
  # Read them at http://localhost:8025 — nothing is delivered to real inboxes.
  mail:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI

volumes:
  pgdata:
